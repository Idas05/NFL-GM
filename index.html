<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Gridiron GM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#f8f7f3; --ink:#1b1d21; --muted:#6a6f78; --line:#e2dfd7;
  --accent:#1f6f4a; --accent-ink:#ffffff; --good:#1f7a3f; --bad:#b3362c; --warn:#a96a00; --chip:#ece9e1;
  --team:#1f6f4a; --team2:#c9a227; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --panel:#181b1f; --panel2:#1e2227; --ink:#e9eaec; --muted:#9097a1; --line:#2a2f36;
  --accent:#3fae7a; --accent-ink:#0b1410; --good:#4cc47e; --bad:#f06a5e; --warn:#e2a93b; --chip:#252a31; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101214; --panel:#181b1f; --panel2:#1e2227; --ink:#e9eaec; --muted:#9097a1; --line:#2a2f36;
  --accent:#3fae7a; --accent-ink:#0b1410; --good:#4cc47e; --bad:#f06a5e; --warn:#e2a93b; --chip:#252a31; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.01em;margin:0}
h2{font-size:22px;font-weight:700} h3{font-size:17px;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.big{padding:11px 18px;font-size:15px}
button.danger{color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px;border-radius:6px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{font:12px ui-monospace,monospace;width:100%;height:160px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 0;flex-wrap:wrap}
.brand{font-family:"Barlow Condensed";font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.teamtag{display:flex;align-items:center;gap:10px}
.swatch{width:14px;height:28px;border-radius:3px;background:linear-gradient(var(--team) 60%,var(--team2) 60%)}
.kpis{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:"Barlow Condensed";font-size:19px;font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--team);font-weight:600}
main{padding:18px 0 60px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.4fr 1fr} .gdraft{grid-template-columns:2.4fr 1fr}
a{color:inherit;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:2px}
a:hover{color:var(--accent)} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:860px){.g2,.g3,.gdraft{grid-template-columns:1fr}.kpis{gap:12px;margin-left:0}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin-bottom:10px}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 8px;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.me td{background:color-mix(in srgb,var(--team) 10%,transparent)}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--panel2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.ovr{display:inline-block;min-width:30px;text-align:center;font-weight:700;border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums;font-family:"Barlow Condensed";font-size:15px}
.o90{background:#1f7a3f;color:#fff}.o80{background:#5aa463;color:#fff}.o70{background:#c9b847;color:#1b1d21}.o60{background:#d9904a;color:#1b1d21}.o0{background:#c4625a;color:#fff}
.rng{font-family:"Barlow Condensed";font-weight:600;font-size:15px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.scoreboard .tm{font-family:"Barlow Condensed";font-size:22px;font-weight:700}
.scoreboard .sc{font-family:"Barlow Condensed";font-size:44px;font-weight:700;line-height:1}
.vs{font-family:"Barlow Condensed";font-size:18px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--team)}
.news li{padding:6px 0;border-bottom:1px solid var(--line);list-style:none}
.news{padding:0;margin:0;max-height:420px;overflow:auto}
.news .t{font-size:11px;color:var(--muted);margin-right:6px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.teambtn{display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.teambtn:hover{border-color:var(--ink)}
.teambtn .sw{width:8px;align-self:stretch;border-radius:3px}
.hero{padding:34px 0 18px}
.hero h1{font-size:44px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 11px;background:var(--panel)}
.seg button.on{background:var(--ink);color:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:20;overflow:auto}
.modal .card{max-width:640px;width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:860px){.bracket{grid-template-columns:1fr 1fr}}
.bg{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:8px;font-size:13px}
.bg .w{font-weight:700}
.attr{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.progress{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.progress i{display:block;height:100%;background:var(--accent)}
.stars{color:var(--warn);letter-spacing:1px}
.foot{font-size:12px;color:var(--muted);margin-top:30px}
.pill-ok{color:var(--good);font-weight:600}.pill-no{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/data.js"></script>
<script src="js/teams.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
