<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Gridiron GM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a night-game broadcast. Floodlit field-green dark ground, team colors as the light source, angled "broadcast package" shapes. */
:root{
  --bg:#070b10; --bg2:#0c131b; --panel:#111a24; --panel2:#16212d; --ink:#eef3f7; --muted:#8a9aab; --line:#223142;
  --accent:#36e08a; --accent-ink:#04120a; --good:#3fdc86; --bad:#ff5a5f; --warn:#ffc53d; --chip:#1c2938; --gold:#ffd166;
  --team:#36e08a; --team2:#ffd166; --teamhi:#36e08a; --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Teko","Barlow Condensed",Impact,sans-serif; --cond:"Barlow Condensed",Inter,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:14px/1.45 var(--body)}
body{background:
  radial-gradient(1200px 500px at 15% -10%, color-mix(in srgb,var(--team) 22%,transparent), transparent 60%),
  radial-gradient(900px 500px at 95% -5%, color-mix(in srgb,var(--team2) 14%,transparent), transparent 60%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 120px),
  linear-gradient(180deg,#0a1219 0%,var(--bg) 420px) var(--bg);
  background-attachment:fixed; min-height:100vh}
h1,h2,h3{font-family:var(--cond);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h2{font-size:24px;font-weight:700} h3{font-size:18px;font-weight:700}
a{color:inherit;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:2px}
a:hover{color:var(--accent)}
button{font:600 13px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:4px;padding:9px 14px;transition:transform .12s,box-shadow .2s,border-color .2s,background .2s}
button:hover{border-color:var(--team);box-shadow:0 0 0 1px var(--team),0 0 18px color-mix(in srgb,var(--team) 35%,transparent)}
button:active{transform:translateY(1px) scale(.98)}
button.primary{background:linear-gradient(100deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff));color:var(--accent-ink);border-color:transparent;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:10px 20px}
button.primary:hover{box-shadow:none;filter:brightness(1.1) drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 60%,transparent))}
button.big{padding:15px 30px;font-size:19px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
button.danger{color:var(--bad)}
button.sm{padding:5px 9px;font-size:12px;border-radius:3px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
textarea{font:12px ui-monospace,monospace;width:100%;height:160px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header banner ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(100deg,color-mix(in srgb,var(--team) 85%,#000) 0%,color-mix(in srgb,var(--team) 45%,#05080c) 55%,#05080c 100%);border-bottom:3px solid var(--team2);box-shadow:0 8px 30px rgba(0,0,0,.45)}
header.top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px);pointer-events:none;mask-image:linear-gradient(90deg,#000,transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#05080c}
.topbar{position:relative;z-index:1;display:flex;align-items:center;gap:16px;padding:12px 0 8px;flex-wrap:wrap}
.teamtag{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:600;font-size:34px;line-height:.9;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sub{font:600 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.kpis{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.kpi{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);padding:6px 14px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);min-width:84px}
.kpi .l{font:600 10px var(--cond);color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.14em}
.kpi .v{font-family:var(--display);font-size:26px;line-height:1;font-weight:500}
nav.tabs{position:relative;z-index:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs button{border:none;border-radius:0;background:rgba(0,0,0,.28);color:rgba(255,255,255,.75);padding:8px 16px;white-space:nowrap;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);font-size:14px}
nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
nav.tabs button.on{background:var(--team2);color:#0b0f14}
nav.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle;box-shadow:0 0 8px var(--bad)}

/* ---------- team badge (original shield) ---------- */
.badge{--c1:#333;--c2:#999;display:inline-grid;place-items:center;width:46px;height:52px;flex:none;clip-path:polygon(50% 0,100% 16%,100% 64%,50% 100%,0 64%,0 16%);background:linear-gradient(160deg,var(--c1) 0 58%,var(--c2) 58% 66%,var(--c1) 66%);font:700 15px/1 var(--display);letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.badge.lg{width:96px;height:108px;font-size:32px}
.badge.xl{width:130px;height:146px;font-size:44px}

main{padding:22px 0 70px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.45fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .gdraft{grid-template-columns:2.4fr 1fr}
@media (max-width:860px){.g2,.g3,.gdraft{grid-template-columns:1fr}.kpis{margin-left:0}.brand{font-size:28px}}
.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;padding:18px;box-shadow:var(--shadow);min-width:0}
.anim .card{animation:rise .35s ease both}
.card::before{content:"";position:absolute;left:0;top:0;height:3px;width:90px;background:var(--teamhi);border-radius:6px 0 0 0}
.card h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:16px;background:var(--team2);transform:skewX(-14deg)}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:1px 7px;font:600 11px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font:600 11px var(--cond);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding:8px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.tbl th:hover{color:var(--ink)}
.tbl td{padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);white-space:nowrap}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.tbl tr.me td{background:color-mix(in srgb,var(--teamhi) 18%,transparent)!important}
.tbl tbody tr:hover td{background:rgba(255,255,255,.04)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.ovr{display:inline-block;min-width:34px;text-align:center;font:500 18px/1.15 var(--display);padding:1px 5px 0;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);font-variant-numeric:tabular-nums}
.o90{background:linear-gradient(135deg,#ffe28a,#e0a91c);color:#2a1d00}.o80{background:#2fbf71;color:#03140a}.o70{background:#3d8bfd;color:#fff}.o60{background:#7b8794;color:#0b0f14}.o0{background:#4a5462;color:#dfe5ea}
.rng{font:500 17px var(--display)}
.vs{font-family:var(--display);font-size:22px;color:var(--muted)}
.bar{height:8px;border-radius:2px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teamhi),var(--team2));transition:width .6s ease}
.news li{padding:7px 0;border-bottom:1px solid var(--line);list-style:none}
.news{padding:0;margin:0;max-height:440px;overflow:auto}
.news .t{font:600 10px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;border-radius:0;padding:7px 11px;background:var(--bg2);font-size:12px}
.seg button:hover{box-shadow:none;background:var(--panel2)}
.seg button.on{background:var(--team2);color:#0b0f14}
.modal .card{animation:rise .3s ease both}
.modal{position:fixed;inset:0;background:rgba(2,5,8,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:20;overflow:auto;animation:fade .2s ease}
.modal .card{max-width:660px;width:100%}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--team2);color:#0b0f14;font:700 15px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:11px 20px;z-index:30;max-width:90vw;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);animation:slideup .25s ease}
@keyframes slideup{from{transform:translate(-50%,20px);opacity:0}}
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:860px){.bracket{grid-template-columns:1fr 1fr}}
.bg{border:1px solid var(--line);border-left:3px solid var(--teamhi);background:var(--bg2);border-radius:3px;padding:6px 8px;margin-bottom:8px;font-size:13px}
.bg .w{font-weight:700;color:var(--gold)}
.attr{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.progress{height:6px;background:var(--chip);border-radius:2px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.progress i{display:block;height:100%;background:var(--accent)}
.stars{color:var(--gold);letter-spacing:1px}
.foot{font-size:12px;color:var(--muted);margin-top:30px}
.pill-ok{color:var(--good);font-weight:600}.pill-no{color:var(--bad);font-weight:600}

/* ---------- start screen ---------- */
.hero{position:relative;padding:46px 0 22px}
.hero .eyebrow{font:600 14px var(--cond);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:var(--display);font-size:clamp(64px,12vw,124px);line-height:.82;font-weight:600;letter-spacing:.02em;background:linear-gradient(180deg,#fff 30%,#9fb3c6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(54,224,138,.25));margin:10px 0 6px}
.lights{position:absolute;inset:-40px 0 auto;height:260px;pointer-events:none;background:radial-gradient(closest-side at 20% 30%,rgba(255,255,255,.18),transparent),radial-gradient(closest-side at 80% 20%,rgba(255,255,255,.12),transparent);filter:blur(10px);animation:flicker 6s ease-in-out infinite}
@keyframes flicker{50%{opacity:.7}}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.teambtn{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:linear-gradient(100deg,color-mix(in srgb,var(--c1) 30%,var(--panel)) 0%,var(--panel) 70%);text-transform:none;letter-spacing:0;font:14px var(--body);overflow:hidden}
.teambtn:hover{border-color:var(--c2);box-shadow:0 0 0 1px var(--c2),0 0 26px color-mix(in srgb,var(--c1) 55%,transparent);transform:translateY(-2px)}
.teambtn b{font:700 17px var(--cond);text-transform:uppercase;letter-spacing:.03em}
.divlabel{font:600 13px var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}

/* ---------- game day ---------- */
.versus{position:relative;overflow:hidden;padding:0}
.versus .vsbody{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:24px 18px 10px;background:linear-gradient(100deg,color-mix(in srgb,var(--c1a) 55%,transparent),transparent 45%,transparent 55%,color-mix(in srgb,var(--c1h) 55%,transparent))}
.versus .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.anim .versus .side{animation:slidein .5s ease both}
.anim .versus .side.r{animation-name:slideinr}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}} @keyframes slideinr{from{transform:translateX(30px);opacity:0}}
.versus .nm{font:600 30px/0.95 var(--display);text-transform:uppercase}
.versus .vsx{font:600 64px/1 var(--display);color:var(--gold);text-shadow:0 0 24px rgba(255,209,102,.45);transform:skewX(-10deg)}
.versus .label{font:600 11px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.versus .inner{padding:14px 18px 18px}
.tale{display:grid;grid-template-columns:44px 1fr 90px 1fr 44px;align-items:center;gap:8px;margin:6px 0;font:500 20px var(--display)}
.tale .mid{text-align:center;font:600 11px var(--cond);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.tale .l{display:flex;justify-content:flex-end}.tale .lb,.tale .rb{height:8px;background:var(--chip);border-radius:2px;overflow:hidden}
.tale .lb i,.tale .rb i{display:block;height:100%}
.tale .lb{direction:rtl}
.wp{font:600 40px/1 var(--display);color:var(--gold)}
.scorebug{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.scorebug .tm{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 22px var(--display);text-transform:uppercase}
.scorebug .sc{font:600 74px/0.9 var(--display);font-variant-numeric:tabular-nums;transition:color .3s}
.scorebug .sc.pop{animation:pop .45s ease}
@keyframes pop{30%{transform:scale(1.25);color:var(--gold)}}
.clock{font:600 14px var(--cond);letter-spacing:.2em;text-transform:uppercase;background:#000;border:1px solid var(--line);padding:4px 12px;display:inline-block}
.qtable{width:100%;border-collapse:collapse;margin-top:12px;font:500 18px var(--display)}
.qtable td,.qtable th{padding:3px 8px;text-align:center;border-bottom:1px solid var(--line)}
.qtable th{font:600 11px var(--cond);letter-spacing:.14em;color:var(--muted)}
.qtable td:first-child{text-align:left}
.ticker{margin-top:12px;max-height:180px;overflow:auto;font-size:13px}
.ticker div{padding:5px 0;border-bottom:1px dashed var(--line);animation:rise .3s ease both}
.stamp{display:inline-block;font:600 46px/1 var(--display);letter-spacing:.06em;padding:4px 18px;border:4px solid currentColor;transform:rotate(-6deg);animation:stamp .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.stamp.win{color:var(--good)} .stamp.loss{color:var(--bad)} .stamp.tie{color:var(--warn)}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}.scoreboard .tm{font:600 26px var(--display);text-transform:uppercase}.scoreboard .sc{font:600 56px/1 var(--display)}
.gameov .card{max-width:720px;background:linear-gradient(180deg,#0b1118,#0e1620);border-color:color-mix(in srgb,var(--team) 50%,var(--line))}
.oncl{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--accent),0 0 28px color-mix(in srgb,var(--accent) 55%,transparent)}}
.trophy{font:600 54px/1 var(--display);color:var(--gold);text-shadow:0 0 30px rgba(255,209,102,.5)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/data.js"></script>
<script src="js/teams.js"></script>
<script src="js/draft2027.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
